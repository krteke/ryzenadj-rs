[package]
name = "ryzenadj-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"
links = "ryzenadj"

[features]
default = []
dynamic = ["dep:cmake"]

[lib]
name = "ryzenadj_sys"
path = "src/lib.rs"

[build-dependencies]
cc = "1.4.7"
cmake = { version = "0.1.58", optional = true }

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.34"
