[package]
name = "ryzenadj-sys"
version = "0.1.0"
build = "build.rs"
links = "ryzenadj"
description = "Raw FFI bindings to RyzenAdj"
keywords = ["amd", "ryzen", "ryzenadj", "ffi"]
categories = ["hardware-support", "external-ffi-bindings"]

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
dynamic = ["dep:cmake"]

[lib]
name = "ryzenadj_sys"
path = "src/lib.rs"

[build-dependencies]
cc = "1.4.7"
cmake = { version = "0.1.58", optional = true }

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.34"
